[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setka-bot-mass"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "scalar-fastapi",
    "pydantic-settings",
    "httpx",
    "sqlalchemy[asyncio]",
    "asyncpg",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: требует postgres и rabbitmq из docker-compose",
]