# Волна 0 (#4): минимальный compose — только api и setka-mock.
# postgres, rabbitmq и worker появятся в волне 4 вместе с БД (#5) и очередью (#11).
#
# Оба сервиса собираются из одного образа (Dockerfile в корне) и отличаются только командой.
# Код мока (mock_setka/) приходит в #6 — до него сервис setka-mock объявлен, но стартовать не может.

x-app: &app
  build: .
  image: setka-sender

services:
  api:
    <<: *app
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

  setka-mock:
    <<: *app
    command: uvicorn mock_setka.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

volumes:
  uploads:
