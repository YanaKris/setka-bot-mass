target-version = "py312"
line-length = 100
src = ["src", "tests", "mock_setka"]
extend-exclude = [".venv", "alembic/versions"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "ASYNC", "S", "RUF"]

[lint.mccabe]
max-complexity = 10

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"mock_setka/**" = ["S105", "S106"]
